name: pebble
description: Offline-first expense and receipt tracker.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  intl: ^0.20.2
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  url_launcher: ^6.3.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Launchers are generated from the committed artwork when scripts/bootstrap.sh runs.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher/pebble_icon.png"
  adaptive_icon_background: "#FFFBF3"
  adaptive_icon_foreground: "assets/launcher/pebble_adaptive_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/launcher/pebble_monochrome.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFBF3"
